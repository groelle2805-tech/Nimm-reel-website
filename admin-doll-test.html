<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>NIMM-DOLL Admin-Test</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--p:#111722;--line:#293241;--lime:#c7ff3d;--muted:#a8b0bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
main{max-width:620px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 4px}h1 span{color:var(--lime)}p{color:var(--muted)}
.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}
label{display:block;font-weight:800;margin:14px 0 7px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#080c12;color:#fff;font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px;color:#ddd}.check input{width:auto}
button{width:100%;border:0;border-radius:12px;padding:15px;background:var(--lime);color:#091006;font-weight:900;font-size:16px;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6}.status{white-space:pre-wrap;margin-top:15px;color:#dce4ef}.err{color:#ff9d9d}.out{display:none;margin-top:18px}.out .stage{position:relative;width:100%;background:linear-gradient(145deg,#222b38,#07090d);border:10px solid #171d27;border-radius:18px;padding:9% 7% 16%;box-shadow:inset 0 0 0 2px #465064}.out .stage:before{content:"NIMM-DOLL  •  COLLECTOR EDITION";position:absolute;left:0;right:0;top:2.5%;text-align:center;font-weight:900;letter-spacing:.08em;font-size:clamp(10px,2.5vw,17px);color:#c7ff3d}.out .stage:after{content:"PREMIUM PERSONALIZED DOLL";position:absolute;left:0;right:0;bottom:2.5%;text-align:center;font-weight:700;letter-spacing:.08em;font-size:clamp(8px,1.9vw,12px);color:#a8b0bf}.out img{width:100%;border-radius:12px;display:block;border:2px solid #5b6574}.nameplate{position:absolute;left:20%;right:20%;bottom:7%;height:7%;display:flex;align-items:center;justify-content:center;text-align:center;background:#111722;border:1px solid #5b6574;border-radius:6px;color:#fff;font-weight:900;font-size:clamp(13px,3.4vw,23px);line-height:1;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;padding:0 5px;box-sizing:border-box;white-space:nowrap}
small{color:var(--muted)}
.out .stage{background:linear-gradient(135deg,#2a3342 0%,#10151e 48%,#06080c 100%)!important;border:12px solid #171d27!important;border-radius:20px!important;padding:10% 8% 17%!important;box-shadow:inset 0 0 0 2px #596476,0 14px 30px rgba(0,0,0,.45)!important;overflow:hidden}.out .stage:after{content:""!important;position:absolute;left:6.5%!important;right:6.5%!important;top:8%!important;bottom:14%!important;border:2px solid rgba(220,235,255,.72)!important;border-radius:20px!important;background:linear-gradient(115deg,rgba(255,255,255,.13),rgba(255,255,255,.015) 35%,rgba(255,255,255,.10) 70%,rgba(255,255,255,.02))!important;box-shadow:inset 0 0 24px rgba(180,210,255,.10),0 2px 12px rgba(0,0,0,.35)!important;pointer-events:none;z-index:2}.out img{border-radius:15px!important;border:1px solid #737e8f!important}.nameplate{z-index:3!important;bottom:5.8%!important;background:#090d14!important}.box-sub{position:absolute;z-index:3;left:0;right:0;bottom:1.5%;text-align:center;font-size:clamp(7px,1.7vw,11px);font-weight:700;letter-spacing:.09em;color:#a8b0bf}
/* Final tall retail-box presentation */
.out .stage{width:min(100%,430px)!important;margin:0 auto!important;aspect-ratio:3/4.45!important;padding:15% 9% 19%!important;background:linear-gradient(145deg,#343d4b 0%,#151b25 45%,#080b10 100%)!important;border:14px solid #202733!important;border-radius:18px!important;box-shadow:12px 14px 0 #080b10,18px 20px 28px rgba(0,0,0,.48),inset 0 0 0 2px #667183!important;overflow:visible!important}
.out .stage:before{top:3.4%!important;font-size:clamp(11px,2.7vw,16px)!important;z-index:5}
.out .stage:after{left:7%!important;right:7%!important;top:11%!important;bottom:15%!important;border:3px solid rgba(218,232,250,.72)!important;border-radius:18px!important;background:linear-gradient(112deg,rgba(255,255,255,.18),rgba(255,255,255,.025) 27%,rgba(255,255,255,.07) 64%,rgba(255,255,255,.015))!important;box-shadow:inset 0 0 34px rgba(190,215,255,.11),inset 0 -18px 28px rgba(0,0,0,.24)!important;z-index:3!important}
.out img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;border-radius:14px!important;border:1px solid #7b8799!important;background:#e7e5df!important}
.nameplate{left:17%!important;right:17%!important;bottom:5.4%!important;height:6.2%!important;z-index:6!important;background:#090c12!important;border:1px solid #778397!important}
.box-sub{bottom:1.5%!important;z-index:6!important}

/* Box image is generated by Runway; UI only supplies controlled clean branding */
.out .stage{width:min(100%,560px)!important;margin:0 auto!important;aspect-ratio:auto!important;padding:0 0 13%!important;background:#0b1018!important;border:2px solid #566173!important;border-radius:18px!important;box-shadow:0 14px 28px rgba(0,0,0,.42)!important;overflow:hidden!important}
.out .stage:before{content:"NIMM-DOLL  •  COLLECTOR EDITION"!important;position:absolute!important;z-index:6!important;left:0!important;right:0!important;top:0!important;height:9%!important;display:flex!important;align-items:center!important;justify-content:center!important;background:linear-gradient(180deg,rgba(5,8,13,.96),rgba(5,8,13,.78))!important;color:#c7ff3d!important}
.out .stage:after{display:none!important}
.out img{width:100%!important;height:auto!important;object-fit:contain!important;border:0!important;border-radius:0!important;background:#0b1018!important}
.nameplate{left:18%!important;right:18%!important;bottom:4.4%!important;height:6.5%!important;z-index:7!important;background:#080c12!important;border:1px solid #778397!important}
.box-sub{bottom:1%!important;z-index:7!important}

/* Controlled cover strips hide Runway packaging pseudo-text */
.clean-top,.clean-bottom{position:absolute;z-index:8;left:0;right:0;pointer-events:none;background:linear-gradient(180deg,#090d14,#111722);display:flex;align-items:center;justify-content:center;text-align:center}
.clean-top{top:0;height:10%;color:#c7ff3d;font-weight:900;letter-spacing:.07em;font-size:clamp(10px,2.6vw,16px);border-bottom:1px solid #596476}
.clean-bottom{bottom:0;height:14%;border-top:1px solid #596476}
.clean-bottom .clean-name{position:absolute;top:12%;left:17%;right:17%;height:46%;display:flex;align-items:center;justify-content:center;border:1px solid #778397;border-radius:7px;background:#070a0f;color:#fff;font-weight:900;font-size:clamp(14px,3.5vw,24px);letter-spacing:.04em}
.clean-bottom .clean-sub{position:absolute;bottom:8%;left:0;right:0;color:#a8b0bf;font-size:clamp(7px,1.7vw,11px);font-weight:700;letter-spacing:.09em}
.out .stage:before,.nameplate,.box-sub{display:none!important}

/* FINAL single-package template: generated doll/assets + deterministic retail packaging */
.final-pack{position:relative;width:min(96%,520px);margin:18px auto 0;background:#080b10;border:0;border-radius:18px;box-shadow:0 18px 38px rgba(0,0,0,.55);overflow:hidden;padding-bottom:16%}
.final-pack:before{display:none;content:"NIMM-DOLL";position:absolute;z-index:12;left:50%;transform:translateX(-50%);top:1.5%;white-space:nowrap;font-size:clamp(23px,6.5vw,34px);font-weight:1000;color:#fff;letter-spacing:.02em;text-shadow:0 2px 5px #000}
.final-pack:after{display:none;content:"LIMITED EDITION";position:absolute;z-index:12;left:50%;transform:translateX(-50%);top:7%;white-space:nowrap;font-size:clamp(8px,2.2vw,12px);font-weight:1000;color:#c7ff3d;letter-spacing:.16em;text-shadow:0 1px 3px #000}
.pack-window{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:100%;border:0;border-radius:0;background:#080b10;overflow:hidden;box-shadow:none}
.pack-window img{width:100%;height:auto;object-fit:contain;object-position:center;display:block;filter:saturate(1.02) contrast(1.02);transform:scale(1.42);transform-origin:50% 50%;margin:10% 0 12%}
.pack-window:after{display:none}
.pack-badge{display:none!important;position:absolute;z-index:14;right:2.7%;top:8.2%;width:58px;height:58px;border-radius:50%;background:#c7ff3d;color:#10151d;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;line-height:1.05;font-weight:1000;transform:rotate(7deg);box-shadow:0 4px 10px rgba(0,0,0,.45)}
.pack-footer{position:absolute;z-index:14;left:10%;right:10%;bottom:1.8%;height:10%;border:2px solid #77849a;border-radius:8px;background:linear-gradient(180deg,#f5f3e9,#dedfd9);color:#0b1017;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(0,0,0,.18)}
.pack-name{font-size:clamp(21px,6vw,32px);font-weight:1000;letter-spacing:.045em;line-height:1}.pack-edition{font-size:8px;font-weight:1000;letter-spacing:.12em;margin-top:7px}
.pack-side{display:none}
#out>.stage{display:none!important}
</style></head><body><main>
<h1>NIMM-<span>DOLL</span> Admin-Test</h1>
<p>Interner Test ohne Stripe. Runway-Credits werden weiterhin verbraucht.</p>
<div class="card">
<label>Admin-Schlüssel</label><input id="key" type="password" autocomplete="off" placeholder="NIMMDOLL_TEST_KEY">
<small>Der Schlüssel wird nicht gespeichert.</small>
<label>Foto</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<label>Name</label><input id="name" maxlength="40" placeholder="z. B. ANDRE">
<label>Style</label><select id="style"><option>Fashion</option><option>Glam</option><option>Y2K</option><option>Luxury</option><option>Business</option><option>Summer</option><option selected>Doll in Box</option></select>
<label>Accessoires</label><div class="grid">
<label class="check"><input type="checkbox" value="Laptop">Laptop</label><label class="check"><input type="checkbox" value="Coffee cup">Kaffeebecher</label>
<label class="check"><input type="checkbox" value="Camera">Kamera</label><label class="check"><input type="checkbox" value="Headphones">Kopfhörer</label>
<label class="check"><input type="checkbox" value="Smartphone">Smartphone</label><label class="check"><input type="checkbox" value="Plant">Pflanze</label>
</div>
<button id="go">Kostenlosen Admin-Test erstellen</button><div id="status" class="status"></div>
<div id="out" class="out"><div class="stage"><img id="result" alt="NIMM-DOLL Testergebnis"><div id="nameplate" class="nameplate"></div><div class="box-sub">PREMIUM PERSONALIZED DOLL</div></div><div id="finalPack" class="final-pack"><div class="pack-window"><img id="finalPackImg" alt="NIMM-DOLL Premium Box"><div id="boxNameMask" class="text-mask-bottom"></div></div><div class="pack-badge">AI<br>POWERED</div><div class="pack-side">PERSONALIZED EDITION</div><div class="pack-footer"><div id="finalPackName" class="pack-name"></div><div class="pack-edition">PERSONALIZED COLLECTOR EDITION</div></div></div><button id="download" type="button">Bild mit Namen herunterladen</button></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
function dataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function downloadFinal(){
 const img=$("result"), name=$("name").value.trim().toUpperCase(), s=$("status");
 try{
  s.className="status";s.textContent="Download wird vorbereitet …";
  const r=await fetch(img.src); if(!r.ok)throw new Error("Bild konnte nicht geladen werden.");
  const blob=await r.blob(), bmp=await createImageBitmap(blob);
  const canvas=document.createElement("canvas"); canvas.width=bmp.width; canvas.height=bmp.height;
  const ctx=canvas.getContext("2d"); ctx.drawImage(bmp,0,0);
  if($("style").value==="Doll in Box"&&name){
   const pad=Math.round(canvas.width*.06), top=Math.round(canvas.height*.07), bottom=Math.round(canvas.height*.16);
   const raw=document.createElement("canvas");raw.width=canvas.width;raw.height=canvas.height;raw.getContext("2d").drawImage(canvas,0,0);
   canvas.width=raw.width+pad*2;canvas.height=raw.height+top+bottom;const out=canvas.getContext("2d");
   out.fillStyle="#111722";out.fillRect(0,0,canvas.width,canvas.height);out.strokeStyle="#465064";out.lineWidth=Math.max(3,canvas.width*.006);out.strokeRect(out.lineWidth/2,out.lineWidth/2,canvas.width-out.lineWidth,canvas.height-out.lineWidth);
   out.drawImage(raw,pad,top);
   out.textAlign="center";out.textBaseline="middle";out.fillStyle="#c7ff3d";out.font=`900 ${Math.max(22,Math.floor(canvas.width*.035))}px Arial,sans-serif`;out.fillText("NIMM-DOLL  •  COLLECTOR EDITION",canvas.width/2,top*.45);
   const w=canvas.width*.58,h=bottom*.46,x=(canvas.width-w)/2,y=top+raw.height+bottom*.13;out.fillStyle="#080c12";out.fillRect(x,y,w,h);out.strokeStyle="#5b6574";out.lineWidth=2;out.strokeRect(x,y,w,h);
   out.fillStyle="#fff";let fs=Math.max(22,Math.floor(canvas.width*.045));out.font=`900 ${fs}px Arial,sans-serif`;while(out.measureText(name).width>w*.88&&fs>14){fs-=2;out.font=`900 ${fs}px Arial,sans-serif`;}out.fillText(name,canvas.width/2,y+h/2,w*.9);
   out.fillStyle="#a8b0bf";out.font=`700 ${Math.max(12,Math.floor(canvas.width*.016))}px Arial,sans-serif`;out.fillText("PREMIUM PERSONALIZED DOLL",canvas.width/2,canvas.height-bottom*.08);
  }
  canvas.toBlob(b=>{if(!b)throw new Error("Bilddatei konnte nicht erstellt werden.");const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`NIMM-DOLL-${name||"Bild"}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);s.textContent="Fertig – der Name ist fest im Bild gespeichert."},"image/jpeg",.95);
 }catch(e){s.className="status err";s.textContent="Download: "+(e.message||String(e))}
}
async function run(){
 const key=$("key").value, file=$("photo").files[0], name=$("name").value.trim(), style=$("style").value, s=$("status");
 s.className="status"; s.textContent="";
 if(!key){s.className="status err";s.textContent="Admin-Schlüssel fehlt.";return}
 if(!file){s.className="status err";s.textContent="Bitte Foto auswählen.";return}
 if(style==="Doll in Box"&&!name){s.className="status err";s.textContent="Bitte Namen eingeben.";return}
 $("go").disabled=true;
 try{
  s.textContent="Test wird gestartet …";
  const image=await dataUrl(file);
  const accessories=[...document.querySelectorAll('.check input:checked')].map(x=>x.value);
  const r=await fetch("/api/doll/admin-test",{method:"POST",headers:{"Content-Type":"application/json","X-NIMMDOLL-Test-Key":key},body:JSON.stringify({image,name,style,accessories})});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||"Test konnte nicht gestartet werden.");
  s.textContent="Runway erstellt deine Doll …";
  for(let i=0;i<60;i++){
   await new Promise(x=>setTimeout(x,2500));
   const p=await fetch("/api/doll?order="+encodeURIComponent(d.orderId)); const q=await p.json();
   if(!p.ok)throw new Error(q.error||"Statusfehler");
   if(q.generationStatus==="failed")throw new Error(q.error||"Bildgenerierung fehlgeschlagen.");
   if(q.generationStatus==="succeeded"&&q.image){$("result").src=q.image;$("nameplate").textContent=style==="Doll in Box"?name:"";if($("cleanName"))$("cleanName").textContent=style==="Doll in Box"?name:"";$("out").style.display="block";if($("finalPackImg"))$("finalPackImg").src=$("result").src;if($("finalPackName"))$("finalPackName").textContent=(name||$("name").value||"").trim();if($("boxNameMask"))$("boxNameMask").textContent=(name||$("name").value||"").trim();localStorage.setItem("nimmdollLastTest",JSON.stringify({orderId:d.orderId,image:q.image,name,style,accessories}));s.textContent="Fertig.";return}
  }
  throw new Error("Die Erstellung dauert länger als erwartet.");
 }catch(e){s.className="status err";s.textContent=e.message||String(e)}
 finally{$("go").disabled=false}
}
async function restoreLastTest(){
 try{
  const saved=JSON.parse(localStorage.getItem("nimmdollLastTest")||"null");if(!saved)return;
  if(saved.name)$("name").value=saved.name;if(saved.style)$("style").value=saved.style;
  if(Array.isArray(saved.accessories)){document.querySelectorAll(".check input").forEach(x=>x.checked=saved.accessories.includes(x.value));}
  let image=saved.image||"";
  if(saved.orderId){try{const r=await fetch("/api/doll?order="+encodeURIComponent(saved.orderId));const q=await r.json();if(r.ok&&q.generationStatus==="succeeded"&&q.image){image=q.image;saved.image=q.image;localStorage.setItem("nimmdollLastTest",JSON.stringify(saved));}}catch{}}
  if(image){$("result").src=image;if($("finalPackImg"))$("finalPackImg").src=image;if($("finalPackName"))$("finalPackName").textContent=(saved.name||$("name").value||"STEFFI").trim()||"STEFFI";if($("boxNameMask"))$("boxNameMask").textContent=(saved.name||$("name").value||"STEFFI").trim()||"STEFFI";$("nameplate").textContent=saved.style==="Doll in Box"?(saved.name||""):"";if($("cleanName"))$("cleanName").textContent=saved.style==="Doll in Box"?(saved.name||""):"";$("out").style.display="block";if($("finalPackImg"))$("finalPackImg").src=$("result").src;if($("finalPackName"))$("finalPackName").textContent=name||"";$("status").textContent="Letztes Testergebnis wiederhergestellt – kein neuer Runway-Credit verbraucht.";}
 }catch{}
}
$("go").addEventListener("click",run);$("download").addEventListener("click",downloadFinal);restoreLastTest();
</script></body></html>
<style>.pack-footer .pack-name{display:block!important;color:#0b1017!important;font-size:clamp(24px,7vw,34px)!important;font-weight:1000!important;line-height:1!important;margin:0 0 4px!important}.pack-footer .pack-edition{font-size:8px!important;margin-top:2px!important}</style>

<style>
/* final deterministic masks over Runway pseudo-text */
.pack-window:before{content:"NIMM-DOLL   •   LIMITED EDITION";position:absolute;z-index:20;left:24%;right:20%;top:15.5%;height:9%;display:flex;align-items:center;justify-content:center;background:#0a0d12;border:2px solid #baff2f;color:#fff;font-size:clamp(11px,3vw,17px);font-weight:1000;letter-spacing:.04em;text-align:center;box-sizing:border-box}
.pack-window .text-mask-bottom{position:absolute;z-index:20;left:25%;right:21%;bottom:18%;height:9%;background:#0a0d12;border:2px solid #baff2f;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:1000;font-size:clamp(15px,4vw,23px);letter-spacing:.04em}
</style>

<style>
/* precise masks for current generated box */
.pack-window:before{left:30%!important;right:23%!important;top:16.8%!important;height:7.2%!important;font-size:clamp(9px,2.4vw,13px)!important;line-height:1.05!important;padding:0 4px!important}
.pack-window .text-mask-bottom{left:30%!important;right:24%!important;bottom:13.2%!important;height:5.8%!important;font-size:clamp(12px,3.2vw,18px)!important}
</style>

<style>
/* calibrated to current Runway package: cover only pseudo-text labels */
.pack-window:before{left:58.5%!important;right:23.5%!important;top:16.4%!important;height:6.5%!important;font-size:clamp(7px,1.7vw,10px)!important;line-height:1.05!important;padding:2px!important;content:"NIMM-DOLL"!important}
.pack-window .text-mask-bottom{left:32.5%!important;right:39%!important;bottom:10.4%!important;height:4.3%!important;font-size:clamp(9px,2.4vw,13px)!important;border-width:1px!important}
</style>
